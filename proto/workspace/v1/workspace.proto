syntax = "proto3";

// workspace.v1: the workspace gateway surface for the webui.
//
// The gateway sits between the webui and the agent. It owns the workspace
// model: a tenant sees only the org/repo it maintains, sessions are named
// `org:repo:branch`, and a session's preset (tool whitelist) is decided AT
// CREATION by the gateway and is then IMMUTABLE.
//
// The webui speaks ONLY this service — never agent.v1 directly. The forwarded
// RPCs below are the minimal chat/model/config/provider/file surface; the
// policy-bearing RPCs (CreateSession, Rename, UpsertPreset, DeletePreset) are
// deliberately absent. UpdateSettings is redefined here WITHOUT
// preset/max_turns/system_prompt/group: a client cannot touch the policy.
package workspace.v1;

import "agent/v1/agent.proto";

option go_package = "github.com/abcp-sdk/workspace-gateway/gen/workspace/v1;wsv1";

// ---- branch sessions (repo:branch <-> session, 1:1) ----

// SandboxRef is one sandbox owned by a session.
message SandboxRef {
  string name = 1;  // sandbox logical name
  string phase = 2; // Running/Pending/... ('' when unknown)
  bool ready = 3;
}

message BranchSession {
  string session = 1; // session name = org:repo:branch
  string org = 2;
  string repo = 3;
  string branch = 4;
  string role = 5;   // maintainer (branch=main) | developer
  string preset = 6; // the immutable preset bound at creation
  // The session's REPRESENTATIVE sandbox (prefer Running/Ready, else newest):
  // its name + phase. Empty when the session owns no sandbox. A session may own
  // SEVERAL sandboxes; the full set is `sandboxes`.
  string sandbox = 7;
  string sandbox_url = 8;
  string phase = 9;  // representative sandbox phase (Running/Pending/...)
  // Every sandbox the session owns, representative first then newest-first.
  repeated SandboxRef sandboxes = 10;
}

message EnsureBranchSessionRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
  // Optional; empty = the repo default branch (main).
  string model = 4;
  // Optional sandbox image override; empty = the gateway default.
  string image = 5;
  // Optional agent language pinned at creation ("zh"/"en"; empty = tenant default).
  string locale = 6;
}
message EnsureBranchSessionResponse { BranchSession branch_session = 1; }

message ListBranchSessionsRequest {}
message ListBranchSessionsResponse { repeated BranchSession branch_sessions = 1; }

message GetBranchSessionRequest { string session = 1; }
message GetBranchSessionResponse { BranchSession branch_session = 1; }

// DeleteBranchSession deletes a branch session (sandboxes + agent session) or
// a free session. For a non-main branch session it ALSO deletes the underlying
// git branch (repo:branch <-> session is 1:1); `main` is protected.
message DeleteBranchSessionRequest { string session = 1; }
message DeleteBranchSessionResponse { bool ok = 1; }

message DeleteBranchRequest { string org = 1; string repo = 2; string branch = 3; }
message DeleteBranchResponse { bool ok = 1; }

// DeleteRepo removes a repository AND every one of its branch sessions
// (session + sandboxes cascade). Admin action; the org is left in place.
message DeleteRepoRequest { string org = 1; string repo = 2; }
message DeleteRepoResponse { bool ok = 1; }

// ForkBranchSession creates a NEW branch workspace from a parent session: the
// gateway derives org/repo from the parent's name, requires `branch` to be a
// legal, non-`main` name, and creates `org:repo:<branch>` as a developer
// session. Branch materialization is driven by the agent lifecycle event
// (the workspace-extension subscribes to `forked`).
message ForkBranchSessionRequest {
  string session = 1; // parent session (org:repo:branch)
  string branch = 2;  // new branch name (legal, != main)
  // Optional: fork at this message instead of the parent's tip.
  string message_id = 3;
}
message ForkBranchSessionResponse { BranchSession branch_session = 1; }

// ---- standalone (free) sessions: admin / explorer ----

message CreateFreeSessionRequest {
  string name = 1;
  string role = 2; // admin | explorer
  string model = 3;
  // Optional agent language pinned at creation ("zh"/"en"; empty = tenant default).
  string locale = 4;
}
message CreateFreeSessionResponse { string session = 1; string preset = 2; }

// ---- git (read-only browse + ensure) ----

message ListReposRequest {}
message RepoInfo {
  string org = 1;
  string repo = 2;
  string default_branch = 3;
  bool private = 4;
}
message ListReposResponse { repeated RepoInfo repos = 1; }

message TreeRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message TreeEntry {
  string path = 1;
  string type = 2; // file | dir
  int64 size = 3;
}
message TreeResponse {
  repeated TreeEntry entries = 1;
  // True when the git host capped the listing (very large repos); the entries
  // are a PARTIAL tree, not the whole repository.
  bool truncated = 2;
}

message ReadBlobRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message ReadBlobResponse {
  string content = 1; // UTF-8 text
  string sha = 2;
}

message LogRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
  int32 limit = 5;
  // Skip the first `offset` commits (newest-first). Used to page history.
  int32 offset = 6;
}
message CommitInfo {
  string sha = 1;
  string message = 2;
  string author = 3;
  string date = 4;
}
message LogResponse {
  repeated CommitInfo commits = 1;
  // True when at least one more commit exists beyond this page.
  bool has_more = 2;
}

message BranchesRequest {
  string org = 1;
  string repo = 2;
}
message BranchInfo {
  string name = 1;
  string sha = 2;
}
message BranchesResponse { repeated BranchInfo branches = 1; }

// ReadRaw returns the raw bytes of one file at a ref. Unlike ReadBlob (UTF-8
// text only, good for editors), ReadRaw carries binary content so the webui can
// preview images / PDF / office files with the SAME viewers the chat uses.
message ReadRawRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message ReadRawResponse {
  bytes data = 1;
  string sha = 2;
  // Server-guessed MIME (from the path) so the client can pick a viewer; may
  // be empty when unknown.
  string mime = 3;
  // Server-classified text: true when the content is valid UTF-8 with no NUL
  // and within the highlighter size limit. The webui shows text as source
  // (never rendered) and anything else as a non-text download.
  bool is_text = 4;
}

message TagsRequest {
  string org = 1;
  string repo = 2;
}
message TagInfo {
  string name = 1;
  string sha = 2;
}
message TagsResponse { repeated TagInfo tags = 1; }

// ---- releases (read-only) ----

message ReleasesRequest {
  string org = 1;
  string repo = 2;
}
message ReleaseAsset {
  int64 id = 1;
  string name = 2;
  int64 size = 3;
  int64 download_count = 4;
  // The release this asset belongs to (Forgejo nests assets under a release).
  int64 release_id = 5;
}
message ReleaseInfo {
  int64 id = 1;
  string tag_name = 2;
  string name = 3;
  string body = 4;
  bool draft = 5;
  bool prerelease = 6;
  string author = 7;
  string created_at = 8;
  string published_at = 9;
  string html_url = 10;
  repeated ReleaseAsset assets = 11;
}
message ReleasesResponse { repeated ReleaseInfo releases = 1; }

// One release asset's bytes, proxied from Forgejo (the browser may not reach
// the git host directly).
message ReleaseAssetRequest {
  string org = 1;
  string repo = 2;
  int64 release_id = 3;
  int64 asset_id = 4;
}
message ReleaseAssetResponse {
  bytes data = 1;
  string name = 2;
  string mime = 3;
}

// GetCommit returns one commit's metadata + message.
message GetCommitRequest {
  string org = 1;
  string repo = 2;
  string sha = 3;
}
message CommitDetail {
  string sha = 1;
  string message = 2;
  string author = 3;
  string author_email = 4;
  string date = 5;
  // Parent SHAs (first parent is sha at index 0).
  repeated string parents = 6;
  string html_url = 7;
}
message GetCommitResponse { CommitDetail commit = 1; }

// CommitDiff returns the unified diff of one commit (Forgejo `.diff`).
message CommitDiffRequest {
  string org = 1;
  string repo = 2;
  string sha = 3;
}
message DiffResponse { string diff = 1; }

// EnsureRepo creates the org + repo + main branch if absent, protects `main`
// (no direct pushes; changes only via MR), and records the (tenant, org, repo)
// ownership so the repo becomes visible to that tenant.
message EnsureRepoRequest {
  string org = 1;
  string repo = 2;
}
message EnsureRepoResponse { bool created = 1; }

// CreateOrg creates an organization owned by the caller's tenant (idempotent:
// an org already owned is returned unchanged). Admin action.
message CreateOrgRequest {
  string org = 1;
}
message CreateOrgResponse { string org = 1; }

// ListOrgs lists the orgs the caller's tenant owns (including empty ones, which
// ListRepos cannot surface).
message ListOrgsRequest {}
message ListOrgsResponse { repeated string orgs = 1; }

// ---- tenant-scoped repo operations (the extension's ONLY path to Forgejo) ----
//
// These mirror the Forgejo REST surface the workspace extension used to call
// directly with a SHARED admin token (a cross-tenant leak). Routing them
// through the gateway makes ownership (ensureVisible) the single gate.

// RepoMeta returns one repository's metadata (default branch + empty flag).
message RepoMetaRequest {
  string org = 1;
  string repo = 2;
}
message RepoMetaResponse {
  string org = 1;
  string repo = 2;
  string default_branch = 3;
  bool private = 4;
  bool empty = 5;
}

// Contents reads a file's UTF-8 text or lists a directory at ref/path.
message ContentsRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message ContentDirEntry {
  string path = 1;
  string name = 2;
  string type = 3; // file | dir | symlink | submodule
  int64 size = 4;
  string sha = 5;
}
message ContentsResponse {
  bool is_dir = 1;
  string text = 2; // when !is_dir
  string sha = 3;
  int64 size = 4;
  repeated ContentDirEntry entries = 5; // when is_dir
}

// CommitFiles creates one commit with several file operations.
message CommitFileOp {
  string path = 1;
  string operation = 2; // create | update | delete
  string content = 3; // UTF-8 (when content_bytes empty)
  bytes content_bytes = 4; // raw bytes (binary-safe; wins over content)
  string sha = 5; // optimistic lock for update/delete
  string from_path = 6; // rename source
}
message CommitFilesRequest {
  string org = 1;
  string repo = 2;
  string message = 3;
  string ref = 4;
  string new_branch = 5;
  repeated CommitFileOp files = 6;
}
message CommitFilesResponse {
  string sha = 1;
  string message = 2;
}

// ---- branch staging (amend semantics) ----
//
// A branch session's writes AMEND one synthetic "staging" commit (message
// sentinel `ABCP_XXX`) instead of appending a commit per edit. BranchStatus
// reports whether that placeholder currently carries staged changes; CommitStaged
// rewinds it to a real message and CLOSES the staging area (the next write opens
// a fresh placeholder), so it never appends an empty commit.

// BranchStatus reports a branch's staging state.
message BranchStatusRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
}
message BranchStatusResponse {
  // HEAD's message is the staging placeholder.
  bool placeholder = 1;
  // The placeholder carries changes (its tree differs from its parent).
  bool staged = 2;
  // HEAD's sha.
  string tip = 3;
  // The sha an MR should merge (the placeholder's parent, else the tip).
  string merge_tip = 4;
}

// CommitStaged rewinds the placeholder to `message`, closing the staging area.
// Refused when nothing is staged (never makes an empty commit).
message CommitStagedRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
  string message = 4;
}
message CommitStagedResponse { string sha = 1; }

// ApplyFiles applies file operations to a branch's staging commit (amending the
// placeholder when one is open, otherwise opening it with the change). This is
// the write path for repo-write/edit/delete/port; it rewrites HEAD, so it never
// touches the default branch.
message ApplyFilesRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
  repeated CommitFileOp files = 4;
}
message ApplyFilesResponse { string sha = 1; }

// Compare returns per-file patches between two refs (`base...head`).
message CompareRequest {
  string org = 1;
  string repo = 2;
  string base = 3;
  string head = 4;
}
message CompareFile {
  string path = 1;
  string status = 2;
  int32 additions = 3;
  int32 deletions = 4;
  string patch = 5;
}
message CompareResponse { repeated CompareFile files = 1; }

// Blame returns per-line authorship of one file at a ref. Forgejo has no blame
// API, so the gateway computes it with go-git over a bare clone.
message BlameRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string path = 4;
}
message BlameLine {
  int32 line = 1; // 1-based line number
  string sha = 2;
  string author = 3;
  string author_email = 4;
  string date = 5;
  string content = 6;
}
message BlameResponse { repeated BlameLine lines = 1; }

// FileDiff returns the unified diff of ONE file between two refs. Forgejo's
// compare API returns an empty `patch` field (1.22), so the gateway computes it
// with go-git. An unchanged file yields an empty diff.
message FileDiffRequest {
  string org = 1;
  string repo = 2;
  string base = 3;
  string head = 4;
  string path = 5;
}
message FileDiffResponse { string diff = 1; }

// CreateTag creates a tag at a target ref.
message CreateTagRequest {
  string org = 1;
  string repo = 2;
  string name = 3;
  string target = 4;
}
message CreateTagResponse { bool ok = 1; }

// CreateBranch creates a branch from an existing ref.
message CreateBranchRequest {
  string org = 1;
  string repo = 2;
  string name = 3;
  string from = 4;
}
message CreateBranchResponse { bool ok = 1; }

// Archive returns a repo tree at a ref as a tar.gz (sandbox checkout).
message ArchiveRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
}
message ArchiveResponse { bytes data = 1; }


// ImportRepo migrates an EXTERNAL git repository into `org` (the tenant must own
// it). Forgejo clones the FULL repository; when `ref` is given that ref becomes
// the default branch and the other branches are deleted (single-branch import).
// The imported repo's branch session is ensured. Refuses to overwrite an
// existing repo.
message ImportRepoRequest {
  string org = 1;
  // Explicit repo name; empty = derived from the URL's last path segment.
  string repo = 2;
  string url = 3;
  // SOURCE ref to import as the new repo's `main`: a branch, a tag, or any
  // revision. Empty = the source's HEAD branch. Only `main` is created.
  string ref = 4;
  string auth_user = 5;
  string auth_token = 6;
  bool private = 7; // ignored: imports are always public
  bool mirror = 8;
  string description = 9;
}
message ImportRepoResponse { RepoInfo repo = 1; }

// ---- push mirrors (admin) ----
// A push mirror continuously pushes this repo's branches to an external remote.
// A repo may have MULTIPLE mirrors; HTTPS only.

message PushMirrorInfo {
  string remote_name = 1;     // Forgejo-assigned mirror id (use to delete)
  string remote_address = 2;  // destination git URL
  string interval = 3;        // periodic sync interval (e.g. "8h")
  bool sync_on_commit = 4;    // push immediately on every commit
  string branch_filter = 5;   // mirrored branch glob (empty = all)
  string last_error = 6;      // last sync error (empty = ok)
  string last_update = 7;     // last sync time
  string created = 8;
}

message SetPushMirrorRequest {
  string org = 1;
  string repo = 2;
  string remote_address = 3;  // https destination git URL
  string remote_username = 4; // auth for a private destination (optional)
  string remote_password = 5;
  bool sync_on_commit = 6;
  string interval = 7;        // Go duration, e.g. "8h" (empty = default)
  string branch_filter = 8;
}
message SetPushMirrorResponse { PushMirrorInfo mirror = 1; }

message ListPushMirrorsRequest {
  string org = 1;
  string repo = 2;
}
message ListPushMirrorsResponse { repeated PushMirrorInfo mirrors = 1; }

message DeletePushMirrorRequest {
  string org = 1;
  string repo = 2;
  string remote_name = 3; // the mirror's remote_name from List
}
message DeletePushMirrorResponse { bool ok = 1; }

// ---- change requests (MRs) — the maintainer's ONLY path to change main ----

message ListMRsRequest {
  string org = 1;
  string repo = 2;
  string state = 3; // open | closed | all
}
message MRInfo {
  int32 index = 1;
  string title = 2;
  string state = 3;
  string head = 4;
  string base = 5;
  string body = 6;
  string author = 7;   // author login
  string created_at = 8;
  string updated_at = 9;
  bool merged = 10;
  bool mergeable = 11;
  int32 additions = 12;
  int32 deletions = 13;
  int32 changed_files = 14;
  string html_url = 15;
}
message ListMRsResponse { repeated MRInfo mrs = 1; }

// GetMR returns one change request's full detail.
message GetMRRequest {
  string org = 1;
  string repo = 2;
  int32 index = 3;
}
message GetMRResponse { MRInfo mr = 1; }

// MRDiff returns the unified diff for a change request (Forgejo `.diff`).
message MRDiffRequest {
  string org = 1;
  string repo = 2;
  int32 index = 3;
}
message MRDiffResponse { string diff = 1; }

// ListMRComments returns the (read-only) conversation on a change request.
message ListMRCommentsRequest {
  string org = 1;
  string repo = 2;
  int32 index = 3;
}
message MRCommentInfo {
  int64 id = 1;
  string author = 2;
  string body = 3;
  string created_at = 4;
  string updated_at = 5;
}
message ListMRCommentsResponse { repeated MRCommentInfo comments = 1; }

message CreateMRRequest {
  string org = 1;
  string repo = 2;
  string title = 3;
  string head = 4; // source branch
  string base = 5; // target branch (main)
  string body = 6;
}
message CreateMRResponse { int32 index = 1; string url = 2; }

message CommentMRRequest {
  string org = 1;
  string repo = 2;
  int32 index = 3;
  string body = 4;
}
message CommentMRResponse { bool ok = 1; }

// MergeMR is a MAINTAINER action (role=maintainer). It is how main changes.
message MergeMRRequest {
  string org = 1;
  string repo = 2;
  int32 index = 3;
}
message MergeMRResponse { bool ok = 1; }

// SyncBranch brings a NON-MAIN branch up to date with its base (`main`) by
// committing a two-parent merge on the branch. Files changed on BOTH sides
// since the merge base are merged three-way; genuine conflicts are written as
// marker blocks (sentinel `ABCP-CONFLICT`, git-style with a base section) that
// the branch session MUST resolve before CreateMR/MergeMR will succeed.
message SyncBranchRequest {
  string org = 1;
  string repo = 2;
  string branch = 3;
}
message SyncBranchResponse {
  // clean = no conflict markers were written.
  bool clean = 1;
  // conflicts lists the repo-relative paths that carry markers.
  repeated string conflicts = 2;
  // commit is the new branch-tip sha (equal to the old one when already current).
  string commit = 3;
}

// ---- OCI images ----
//
// Sandboxes are launched from ANY base image: the gateway derives a runnable
// sandbox by injecting the easyworker binary into the base at launch time
// (FROM <base> + COPY worker + worker entrypoint). ListOCIImages browses the
// registry so a caller can discover what is available.

// OCIImage is one image tag in the registry.
message OCIImage {
  string owner = 1; // user or org namespace
  string name = 2;  // image name (may contain '/')
  string tag = 3;
  string ref = 4;   // full ref: <registry>/<owner>/<name>:<tag>
}
// ListOCIImages lists container images. `owner` selects the namespace
// (default: the deployment's toolchain org). `name` narrows to ONE image,
// listing its tags.
message ListOCIImagesRequest {
  string owner = 1;
  string name = 2;
}
message ListOCIImagesResponse { repeated OCIImage images = 1; }

// BuildSandboxImage builds an image from a repository's Dockerfile (context =
// a repo subdirectory) and pushes it to the deployment registry. The produced
// image does NOT have easyworker injected: the Dockerfile must FROM a
// worker-capable base for the result to be usable as a sandbox.
message BuildSandboxImageRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  // Repo-relative Dockerfile path (default "Dockerfile").
  string dockerfile = 4;
  // Repo-relative build context subdirectory (default "" = repo root).
  string context = 5;
  // Image name (single path segment, pushed under the deployment registry).
  string image = 6;
  string tag = 7;
  map<string, string> build_args = 8;
}
message BuildSandboxImageResponse {
  string image_ref = 1;
  string log = 2;
}

// ImportImage mirrors an upstream image (public or, with credentials, private)
// into the deployment registry under an org the caller owns, with a no-op
// `FROM <source>` rebuild. The upstream config (entrypoint/env/...) is kept.
message ImportImageRequest {
  // Destination org (must be owned by the caller's tenant). The image lands at
  // <registry>/<org>/<name>:<tag>.
  string org = 1;
  // Destination image name (single path segment).
  string name = 2;
  // Destination tag (e.g. the upstream version).
  string tag = 3;
  // Upstream image ref to mirror (e.g. docker.io/library/redis:7.4.2).
  string source = 4;
  // Basic-auth for a PRIVATE source registry (optional).
  string auth_user = 5;
  string auth_token = 6;
}
message ImportImageResponse {
  string image_ref = 1;
  string log = 2;
}

// ---- sandboxes (the gateway owns the k8s lifecycle in-process) ----

// A sandbox belongs to the SESSION that created it (annotation on the k8s
// objects), so a session can enumerate and drive its own sandboxes. The tenant
// remains the visibility boundary.
message ListSandboxesRequest {
  // Optional filter: only sandboxes bound to this session name.
  string session = 1;
}
message SandboxInfo {
  string name = 1;
  string image = 2;
  string phase = 3;
  bool ready = 4;
  string url = 5;
  string creator = 6;
  int64 created_at = 7;
  // The session this sandbox is bound to (`org:repo:branch`, or a free-session
  // name). Empty for legacy sandboxes created before session binding.
  string session = 8;
  // Worker environment (from the worker's Info; best-effort, empty when the
  // sandbox is not yet reachable). `workspace` is the root a RELATIVE path
  // resolves against; `home` is the worker user's home (the OS `~`).
  string workspace = 9;
  string home = 10;
  string os = 11;
  string arch = 12;
}
message ListSandboxesResponse { repeated SandboxInfo sandboxes = 1; }

message CreateSandboxRequest {
  string name = 1;
  // Pre-built, worker-bundled sandbox image (see list-oci-images, owner = the
  // deployment's sandbox org). The gateway does NOT inject the worker: the
  // image MUST already contain agent-worker and come from the sandbox org.
  // Empty = the deployment default sandbox image.
  string image = 2;
  string cpu = 3;
  string memory = 4;
  // Extra environment variables for the worker container (WORKER_TOKEN and
  // WORKER_PORT are set by the gateway).
  map<string, string> env = 5;
  // Request KVM (/dev/kvm via the device plugin) — non-privileged.
  bool kvm = 6;
  // Request this many NVIDIA GPUs (0 = none; needs the GPU device plugin).
  int32 gpu_count = 7;
  // The session this sandbox belongs to. Bound as an annotation so the sandbox
  // can be enumerated/fanned out to per session.
  string session = 8;
}
message CreateSandboxResponse { SandboxInfo sandbox = 1; }

message DeleteSandboxRequest { string name = 1; }
message DeleteSandboxResponse { bool ok = 1; }

message GetSandboxRequest { string name = 1; }
message GetSandboxResponse { SandboxInfo sandbox = 1; }

// ResolveSandbox returns the connect address + bearer token for a sandbox the
// caller owns, so an execution tool can talk to the worker directly.
message ResolveSandboxRequest { string name = 1; }
message ResolveSandboxResponse {
  string name = 1;
  string url = 2;
  string token = 3;
}

// ---- sandbox jobs (read-only observability) ----
//
// The webui can watch what a sandbox is doing: the worker keeps a bounded job
// history (≤500 entries, 24h). JobOutput is a poll of a job's buffered lines;
// WatchSandboxJob is a server-stream that replays history then streams live
// output (a passthrough of the worker's WatchJob).

message ListSandboxJobsRequest { string name = 1; }
message SandboxJob {
  string id = 1;
  string command = 2;
  string state = 3;      // running | done | killed | failed
  int32 exit_code = 4;
  int64 started_at = 5;  // unix millis
  int64 finished_at = 6; // unix millis, 0 while running
}
message ListSandboxJobsResponse { repeated SandboxJob jobs = 1; }

message GetSandboxJobOutputRequest {
  string name = 1;
  string job_id = 2;
  // Line window: negative `start` counts from the end (-200 = last 200 lines).
  int32 start = 3;
  int32 end = 4;            // exclusive; 0 = through the end
  string stream = 5;        // all | stdout | stderr
}
message GetSandboxJobOutputResponse {
  repeated string lines = 1;
  int32 total_lines = 2;
  int32 start_line = 3;
  int32 end_line = 4;
  bool done = 5;
}

message WatchSandboxJobRequest {
  string name = 1;
  string job_id = 2;
}
message WatchSandboxJobResponse {
  // Incremental output chunk (stdout+stderr as the worker emits it).
  string output = 1;
  // Terminal event (always the last message): the job finished.
  bool done = 2;
  int32 exit_code = 3;
  string stdout = 4; // tail
  string stderr = 5; // tail
}

// ---- sandbox files (read-only browser over the worker filesystem) ----
//
// A sandbox is the worker's own filesystem: a relative path resolves against
// the worker's workspace root, an absolute path is used verbatim (the worker
// may touch any path in its container). The webui browses it read-only.

message SandboxFileEntry {
  // Workspace-relative when inside the workspace, absolute otherwise.
  string path = 1;
  int64 size = 2;
  bool is_dir = 3;
}
message ListSandboxFilesRequest {
  string name = 1;
  // Directory (or a single file) to list. "" / "." = the workspace root.
  string path = 2;
  // Expand directories up to `depth` levels (1 = immediate children, default).
  int32 depth = 3;
  int32 limit = 4; // max entries (<=0 = 1000, hard cap 10000)
}
message ListSandboxFilesResponse {
  bool is_dir = 1;
  repeated SandboxFileEntry files = 2;
}

message ReadSandboxFileRequest {
  string name = 1;
  string path = 2;
  // Optional 0-based line window (end exclusive; 0 = through EOF; a negative
  // start counts from the end). Omitted reads the whole file.
  int32 start_line = 3;
  int32 end_line = 4;
}
message ReadSandboxFileResponse {
  bytes content = 1;
  int32 total_lines = 2;
  int32 start_line = 3;
  int32 end_line = 4;
}

// ---- services (long-lived Deployments) ----
//
// A service runs a user image as a long-lived Kubernetes Deployment + Service
// (no worker injection, no sidecar). It is meant for things a sandbox talks to
// (an app, a database proxy, ...), not for execution.

message ServiceInfo {
  string name = 1;
  string image = 2;
  string phase = 3;
  bool ready = 4;
  int32 replicas = 5;
  string url = 6; // http://<name>.<ns>.svc.cluster.local:<service_port>
  string creator = 7; // owning tenant
  // The session that deployed the service (empty = legacy / unbound).
  string session = 8;
  // Public, anonymous URL the service is reachable at from outside the cluster:
  // https://<name>.<service_domain> (the cluster edge maps
  // <name>.<ns>.<domain> to the service's port 80). Empty when the public
  // domain could not be determined.
  string public_url = 9;
  // Every port this service exposes (one k8s Service per distinct `name`).
  repeated ServicePortInfo ports = 10;
  // Stage: "release" (long-lived, public) or "preview" (developer verification:
  // session-bound, cluster-only, TTL-reclaimed).
  string stage = 11;
  // Pod diagnostics (best-effort): the pod phase, total container restarts and
  // the first unhealthy container reason (e.g. CrashLoopBackOff).
  string pod_phase = 12;
  int32 restarts = 13;
  string message = 14;
  // Unix-millis TTL deadline of a preview service (0 = none).
  int64 expires_at = 15;
  // Paused is true when the service is scaled to zero replicas (PauseService);
  // ResumeService restores the replica count it had before the pause.
  bool paused = 16;
  // Unix-millis creation time of the service's Deployment (list sort key).
  int64 created_at = 17;
  // Number of pods reporting ready (from the Deployment status).
  int32 ready_replicas = 18;
  // Desired replica count is `replicas`; `ready_replicas` is how many are up.
  // Container resource requests/limits, as the k8s quantity strings.
  string cpu = 19;
  string memory = 20;
  // Container command override (argv) and environment variables.
  repeated string command = 21;
  map<string, string> env = 22;
  // PVCs mounted into the container.
  repeated VolumeMountInfo volumes = 23;
}

// VolumeMountInfo is one PVC mounted into a service container.
message VolumeMountInfo {
  string pvc = 1;
  string mount_path = 2;
  bool read_only = 3;
  string sub_path = 4;
}

// ServicePortInfo is one exposed port of a service.
message ServicePortInfo {
  // Service suffix ("" = the primary service `<name>`; else `<name>-<suffix>`).
  string name = 1;
  // Preset: tcp80 | tcp443 | udp443.
  string preset = 2;
  // k8s Service port (from the preset).
  int32 port = 3;
  // tcp | udp.
  string protocol = 4;
  // Container port this forwards to.
  int32 target_port = 5;
  // Anonymous public URL when this port is a tcp80 ingress
  // (`https://<name>[-<suffix>].<ns>.<domain>`); empty otherwise.
  string public_url = 6;
}

// ServicePortSpec declares one exposed port of a deployed service.
message ServicePortSpec {
  // Service suffix. "" = the primary service (`<name>`, publicly reachable as
  // https://<name>.<domain>). A non-empty value creates a SIBLING service named
  // `<name>-<suffix>` (for a second public endpoint).
  string name = 1;
  // Preset: tcp80 (public HTTP ingress) | tcp443 | udp443 (in-cluster only).
  string preset = 2;
  // Container port to forward to (0 = the request's container_port).
  int32 target_port = 3;
}

// VolumeMountSpec mounts a named PersistentVolumeClaim (created via CreatePVC)
// into a service container. The claim MUST exist and belong to the caller's
// tenant.
message VolumeMountSpec {
  // PVC name (in the managed namespace).
  string pvc = 1;
  // Absolute mount path inside the container.
  string mount_path = 2;
  // Mount read-only.
  bool read_only = 3;
  // Optional sub-path within the volume.
  string sub_path = 4;
}

message DeployServiceRequest {
  // Service name. Empty = derived from the session (org-repo-branch slug).
  string name = 1;
  // Container image to run as-is.
  string image = 2;
  // Container port the app listens on (default 8080).
  int32 container_port = 3;
  // Service port exposed in-cluster (default 80).
  int32 service_port = 4;
  // Replicas (default 1).
  int32 replicas = 5;
  map<string, string> env = 6;
  string cpu = 7;
  string memory = 8;
  // Optional command override (argv).
  repeated string command = 9;
  // Request KVM (/dev/kvm via the device plugin) — non-privileged.
  bool kvm = 10;
  // Request this many NVIDIA GPUs (0 = none; needs the GPU device plugin).
  int32 gpu_count = 11;
  // Ports to expose. Empty = the default single public port (tcp80 ->
  // container_port). Entries sharing a `name` merge into ONE k8s Service
  // (multi-port); a second public endpoint (tcp80) needs a distinct `name`.
  repeated ServicePortSpec services = 12;
  // PVCs to mount into the container.
  repeated VolumeMountSpec volumes = 13;
}
message DeployServiceResponse { ServiceInfo service = 1; }

// PreviewService deploys a PREVIEW service for verification: session-bound,
// cluster-only (no public URL), and reclaimed on session end / TTL.
message PreviewServiceRequest {
  // Image to run as-is.
  string image = 2;
  // Base name (a DNS-1123 label); the gateway prefixes it with the session slug.
  string name = 3;
  int32 container_port = 4;
  map<string, string> env = 5;
  string cpu = 6;
  string memory = 7;
  repeated string command = 8;
  bool kvm = 9;
  int32 gpu_count = 10;
  // Ports to expose (cluster-internal only). Empty = one port 80 -> container.
  repeated ServicePortSpec services = 11;
  // TTL in seconds (0 = the deployment default).
  int32 ttl_seconds = 12;
  // PVCs to mount into the container.
  repeated VolumeMountSpec volumes = 13;
}
message PreviewServiceResponse { ServiceInfo service = 1; }

message ListServicesRequest {}
message ListServicesResponse { repeated ServiceInfo services = 1; }

message DeleteServiceRequest { string name = 1; }
message DeleteServiceResponse { bool ok = 1; }

// ---- persistent volume claims (admin-managed storage for services) ----
//
// A PVC is a NAMED, tenant-owned volume created with the deployment's storage
// class (self-hosted local-path). Services mount it by name via VolumeMountSpec.
// Deleting a service does NOT delete its PVCs; DeletePVC refuses while any
// service still mounts the claim.

message PVCInfo {
  string name = 1;
  string size = 2;          // requested storage, e.g. "1Gi"
  string storage_class = 3;
  // k8s phase: Pending (unbound; local-path binds on first consumer) | Bound |
  // Lost. A freshly created local-path PVC stays Pending until a pod mounts it.
  string phase = 4;
  string creator = 5;       // owning tenant
  int64 created_at = 6;     // unix millis
  // Names of the tenant's services currently mounting this PVC.
  repeated string mounted_by = 7;
}
message CreatePVCRequest {
  // DNS-1123 label (the claim name).
  string name = 1;
  // Requested size (k8s quantity, e.g. "1Gi"). Empty = the deployment default.
  // NOTE: local-path does NOT enforce the size; it only records the request.
  string size = 2;
  // StorageClass. Empty = the deployment's configured class; a non-empty value
  // must equal that class (only the self-hosted local-path is supported).
  string storage_class = 3;
}
message CreatePVCResponse { PVCInfo pvc = 1; }

message ListPVCsRequest {}
message ListPVCsResponse { repeated PVCInfo pvcs = 1; }

message DeletePVCRequest { string name = 1; }
message DeletePVCResponse { bool ok = 1; }

// PauseService scales a service to zero replicas (without deleting it). The
// replica count in effect at pause time is remembered so ResumeService can
// restore it.
message PauseServiceRequest { string name = 1; }
message PauseServiceResponse { ServiceInfo service = 1; }

// ResumeService restores a paused service to the replica count it had before
// PauseService.
message ResumeServiceRequest { string name = 1; }
message ResumeServiceResponse { ServiceInfo service = 1; }

// ScaleService sets a service's desired replica count (0 = scaled down but
// still present; unlike PauseService the count is not remembered for resume).
message ScaleServiceRequest {
  string name = 1;
  int32 replicas = 2;
}
message ScaleServiceResponse { ServiceInfo service = 1; }

// GetServiceManifest returns the service's Deployment + its Services as a
// multi-document YAML (server-side status/metadata stripped). Read-only.
message GetServiceManifestRequest { string name = 1; }
message GetServiceManifestResponse {
  // The multi-document YAML, `---`-separated (Deployment first).
  string yaml = 1;
}

// ApplyServiceManifest replaces a service from an edited multi-document YAML.
// The name(s) must resolve to a service the caller's tenant owns; the
// Deployment's selector/name/labels are pinned so the manifest cannot
// retarget another service. `dry_run` validates + returns the diff-like YAML
// without writing.
message ApplyServiceManifestRequest {
  string name = 1;
  string yaml = 2;
  bool dry_run = 3;
}
message ApplyServiceManifestResponse {
  ServiceInfo service = 1;
  // The normalized YAML that was (or would be) applied.
  string yaml = 2;
}

// ---- service logs ----
message ServiceLogsRequest {
  string name = 1;
  // Number of trailing lines (0 = the deployment default).
  int64 tail_lines = 2;
  // Read the PREVIOUS container instance (the crash that restarted it).
  bool previous = 3;
}
message ServiceLogsResponse { repeated string lines = 1; }

message WatchServiceLogsRequest {
  string name = 1;
  bool previous = 2;
}
message WatchServiceLogsResponse {
  // Incremental log chunk (may contain several lines).
  string output = 1;
  // Terminal event (always the last message): the stream ended.
  bool done = 2;
  // Reason the stream ended (e.g. container exit); empty on a clean end.
  string error = 3;
}

// BuildPreviewImage builds a PREVIEW image from a repository Dockerfile. The
// image name is FORCED to the repo name and the tag is FORCED to
// `preview-<branch>-<sha>` (the caller may add a suffix), so a preview build
// can never overwrite a release tag.
message BuildPreviewImageRequest {
  string org = 1;
  string repo = 2;
  string ref = 3;
  string dockerfile = 4;
  string context = 5;
  // Optional tag suffix appended after the forced preview prefix.
  string tag_suffix = 6;
  map<string, string> build_args = 7;
}
message BuildPreviewImageResponse {
  string image_ref = 1;
  string log = 2;
  string tag = 3;
}

// ---- settings (NARROWED) ----

// UpdateSettings lets a user change only what is safe to change on an existing
// session: the model, its reasoning variant, and the agent locale. The
// policy-bearing fields (preset, max_turns, system_prompt, group) are NOT part
// of this surface: the gateway fills them from the immutable preset.
message UpdateSettingsRequest {
  string id = 1;
  string model = 2;
  string variant = 3;
  string locale = 4;
}
message UpdateSettingsResponse { agent.v1.Session session = 1; }

service BranchSessionService {
  // branch sessions (repo:branch <-> session, 1:1)
  rpc EnsureBranchSession(EnsureBranchSessionRequest) returns (EnsureBranchSessionResponse);
  rpc ForkBranchSession(ForkBranchSessionRequest) returns (ForkBranchSessionResponse);
  rpc ListBranchSessions(ListBranchSessionsRequest) returns (ListBranchSessionsResponse);
  rpc GetBranchSession(GetBranchSessionRequest) returns (GetBranchSessionResponse);
  rpc DeleteBranchSession(DeleteBranchSessionRequest) returns (DeleteBranchSessionResponse);
  // DeleteBranch removes a repo branch AND its branch session (session +
  // sandboxes cascade); requires the branch owner (non-main).
  rpc DeleteBranch(DeleteBranchRequest) returns (DeleteBranchResponse);
  // DeleteRepo removes a repo AND all its branch sessions (admin).
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  // standalone sessions
  rpc CreateFreeSession(CreateFreeSessionRequest) returns (CreateFreeSessionResponse);
  // git browse (read-only) + ensure
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc Tree(TreeRequest) returns (TreeResponse);
  rpc ReadBlob(ReadBlobRequest) returns (ReadBlobResponse);
  // ReadRaw carries binary bytes so the webui can preview images / PDF / office.
  rpc ReadRaw(ReadRawRequest) returns (ReadRawResponse);
  rpc Log(LogRequest) returns (LogResponse);
  rpc Branches(BranchesRequest) returns (BranchesResponse);
  rpc Tags(TagsRequest) returns (TagsResponse);
  // releases (read-only; assets are proxied by the gateway)
  rpc ListReleases(ReleasesRequest) returns (ReleasesResponse);
  rpc GetReleaseAsset(ReleaseAssetRequest) returns (ReleaseAssetResponse);
  // commit + diff (read-only)
  rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
  rpc CommitDiff(CommitDiffRequest) returns (DiffResponse);
  rpc EnsureRepo(EnsureRepoRequest) returns (EnsureRepoResponse);
  // CreateOrg creates an org owned by the caller's tenant (admin).
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // ListOrgs lists the caller's tenant-owned orgs (incl. empty ones).
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  // Tenant-scoped repo operations (the extension's ONLY path to Forgejo).
  rpc RepoMeta(RepoMetaRequest) returns (RepoMetaResponse);
  rpc Contents(ContentsRequest) returns (ContentsResponse);
  rpc CommitFiles(CommitFilesRequest) returns (CommitFilesResponse);
  rpc BranchStatus(BranchStatusRequest) returns (BranchStatusResponse);
  rpc CommitStaged(CommitStagedRequest) returns (CommitStagedResponse);
  rpc ApplyFiles(ApplyFilesRequest) returns (ApplyFilesResponse);
  rpc Compare(CompareRequest) returns (CompareResponse);
  rpc Blame(BlameRequest) returns (BlameResponse);
  rpc FileDiff(FileDiffRequest) returns (FileDiffResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
  rpc Archive(ArchiveRequest) returns (ArchiveResponse);
  // ImportRepo migrates an EXTERNAL git repository into an org (admin).
  rpc ImportRepo(ImportRepoRequest) returns (ImportRepoResponse);
  // push mirrors (admin): push this repo to external remotes continuously
  rpc SetPushMirror(SetPushMirrorRequest) returns (SetPushMirrorResponse);
  rpc ListPushMirrors(ListPushMirrorsRequest) returns (ListPushMirrorsResponse);
  rpc DeletePushMirror(DeletePushMirrorRequest) returns (DeletePushMirrorResponse);
  // change requests (read-only in this surface: List/Get/diff/comments)
  rpc ListMRs(ListMRsRequest) returns (ListMRsResponse);
  rpc GetMR(GetMRRequest) returns (GetMRResponse);
  rpc MRDiff(MRDiffRequest) returns (MRDiffResponse);
  rpc ListMRComments(ListMRCommentsRequest) returns (ListMRCommentsResponse);
  rpc CreateMR(CreateMRRequest) returns (CreateMRResponse);
  rpc CommentMR(CommentMRRequest) returns (CommentMRResponse);
  rpc MergeMR(MergeMRRequest) returns (MergeMRResponse);
  // SyncBranch (re)integrates the base into a feature branch, writing conflict
  // markers for the branch session to resolve (developer action).
  rpc SyncBranch(SyncBranchRequest) returns (SyncBranchResponse);
  // OCI images
  rpc ListOCIImages(ListOCIImagesRequest) returns (ListOCIImagesResponse);
  rpc BuildSandboxImage(BuildSandboxImageRequest) returns (BuildSandboxImageResponse);
  rpc ImportImage(ImportImageRequest) returns (ImportImageResponse);
  // sandboxes
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);
  rpc ResolveSandbox(ResolveSandboxRequest) returns (ResolveSandboxResponse);
  // sandbox jobs (read-only observability)
  rpc ListSandboxJobs(ListSandboxJobsRequest) returns (ListSandboxJobsResponse);
  rpc GetSandboxJobOutput(GetSandboxJobOutputRequest) returns (GetSandboxJobOutputResponse);
  rpc WatchSandboxJob(WatchSandboxJobRequest) returns (stream WatchSandboxJobResponse);
  rpc ListSandboxFiles(ListSandboxFilesRequest) returns (ListSandboxFilesResponse);
  rpc ReadSandboxFile(ReadSandboxFileRequest) returns (ReadSandboxFileResponse);
  // services (long-lived Deployments)
  rpc DeployService(DeployServiceRequest) returns (DeployServiceResponse);
  // PreviewService deploys a session-bound, cluster-only preview (developer).
  rpc PreviewService(PreviewServiceRequest) returns (PreviewServiceResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc PauseService(PauseServiceRequest) returns (PauseServiceResponse);
  rpc ResumeService(ResumeServiceRequest) returns (ResumeServiceResponse);
  // ScaleService sets the desired replica count (0 = scaled down).
  rpc ScaleService(ScaleServiceRequest) returns (ScaleServiceResponse);
  // GetServiceManifest returns the Deployment + Services as YAML (read-only).
  rpc GetServiceManifest(GetServiceManifestRequest) returns (GetServiceManifestResponse);
  // ApplyServiceManifest replaces a service from edited YAML (owner-only).
  rpc ApplyServiceManifest(ApplyServiceManifestRequest) returns (ApplyServiceManifestResponse);
  // Persistent volume claims (admin-managed storage for services).
  rpc CreatePVC(CreatePVCRequest) returns (CreatePVCResponse);
  rpc ListPVCs(ListPVCsRequest) returns (ListPVCsResponse);
  rpc DeletePVC(DeletePVCRequest) returns (DeletePVCResponse);
  // service logs (read a service's container logs; seam for a log backend)
  rpc ServiceLogs(ServiceLogsRequest) returns (ServiceLogsResponse);
  rpc WatchServiceLogs(WatchServiceLogsRequest) returns (stream WatchServiceLogsResponse);
  // BuildPreviewImage builds a preview-tagged image (forced name/tag).
  rpc BuildPreviewImage(BuildPreviewImageRequest) returns (BuildPreviewImageResponse);

  // ---- forwarded agent surface (minimal; no policy RPCs) ----
  rpc Health(agent.v1.HealthRequest) returns (agent.v1.HealthResponse);
  rpc GetIdentity(agent.v1.GetIdentityRequest) returns (agent.v1.GetIdentityResponse);
  rpc ListSessions(agent.v1.ListSessionsRequest) returns (agent.v1.ListSessionsResponse);
  rpc GetSession(agent.v1.GetSessionRequest) returns (agent.v1.GetSessionResponse);
  // NOTE: session deletion is NOT forwarded verbatim. Use DeleteBranchSession
  // (the single, authorized, cascading entry point) so ownership is checked and
  // sandboxes/free-session rows are reclaimed consistently.
  rpc ListMessages(agent.v1.ListMessagesRequest) returns (agent.v1.ListMessagesResponse);
  rpc Prompt(agent.v1.PromptRequest) returns (stream agent.v1.PromptResponse);
  rpc WatchSession(agent.v1.WatchSessionRequest) returns (stream agent.v1.WatchSessionResponse);
  rpc WatchSessions(agent.v1.WatchSessionsRequest) returns (stream agent.v1.WatchSessionsResponse);
  rpc SetModel(agent.v1.SetModelRequest) returns (agent.v1.SetModelResponse);
  rpc Undo(agent.v1.UndoRequest) returns (agent.v1.UndoResponse);
  rpc State(agent.v1.StateRequest) returns (agent.v1.StateResponse);
  rpc Mailbox(agent.v1.MailboxRequest) returns (agent.v1.MailboxResponse);
  rpc Interrupt(agent.v1.InterruptRequest) returns (agent.v1.InterruptResponse);
  rpc Compact(agent.v1.CompactRequest) returns (agent.v1.CompactResponse);
  // settings (narrowed)
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // models + providers (per-tenant config)
  rpc ListProviders(agent.v1.ListProvidersRequest) returns (agent.v1.ListProvidersResponse);
  rpc ListProvidersCatalog(agent.v1.ListProvidersCatalogRequest) returns (agent.v1.ListProvidersCatalogResponse);
  rpc RegisterProvider(agent.v1.RegisterProviderRequest) returns (agent.v1.RegisterProviderResponse);
  rpc DeleteProvider(agent.v1.DeleteProviderRequest) returns (agent.v1.DeleteProviderResponse);
  rpc TestProvider(agent.v1.TestProviderRequest) returns (agent.v1.TestProviderResponse);
  rpc ListModels(agent.v1.ListModelsRequest) returns (agent.v1.ListModelsResponse);
  // presets (READ-ONLY: no upsert/delete)
  rpc ListPresets(agent.v1.ListPresetsRequest) returns (agent.v1.ListPresetsResponse);
  rpc PreviewPreset(agent.v1.PreviewPresetRequest) returns (agent.v1.PreviewPresetResponse);
  // config + tools (per-tenant config)
  rpc GetConfig(agent.v1.GetConfigRequest) returns (agent.v1.GetConfigResponse);
  rpc SetConfig(agent.v1.SetConfigRequest) returns (agent.v1.SetConfigResponse);
  rpc ListTools(agent.v1.ListToolsRequest) returns (agent.v1.ListToolsResponse);
  rpc GetToolConfig(agent.v1.GetToolConfigRequest) returns (agent.v1.GetToolConfigResponse);
  rpc SetToolConfig(agent.v1.SetToolConfigRequest) returns (agent.v1.SetToolConfigResponse);
  rpc SetExtensionConfig(agent.v1.SetExtensionConfigRequest) returns (agent.v1.SetExtensionConfigResponse);
  // files
  rpc UploadFile(agent.v1.UploadFileRequest) returns (agent.v1.UploadFileResponse);
  rpc IngestFile(agent.v1.IngestFileRequest) returns (agent.v1.IngestFileResponse);
  rpc GetFile(agent.v1.GetFileRequest) returns (agent.v1.GetFileResponse);
  rpc GetFileMeta(agent.v1.GetFileMetaRequest) returns (agent.v1.GetFileMetaResponse);
  rpc GetFileStream(agent.v1.GetFileRequest) returns (stream agent.v1.FileChunk);
}
