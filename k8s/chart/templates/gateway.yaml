{{- if .Values.gateway.enabled }}
# Workspace gateway: the ONLY trusted session-creation entry point (role +
# immutable preset) and the sandbox/service lifecycle surface (workspace.v1).
# Manages objects in the `worker` namespace IN-PROCESS (worker-manager folded
# in); talks to the workspace agent (h2c), Forgejo and buildkitd over DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-gateway
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
    app: workspace-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: workspace-gateway }
  template:
    metadata:
      labels:
        {{- include "workspace.labels" . | nindent 8 }}
        app: workspace-gateway
    spec:
      serviceAccountName: {{ include "workspace.saName" . }}
      containers:
        - name: workspace-gateway
          image: {{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - { name: PORT, value: "8080" }
            - { name: GATEWAY_DB, value: /data/workspace-gateway.db }
            - { name: AGENT_URL, value: {{ include "workspace.agentUrl" . | quote }} }
            - { name: SANDBOX_NAMESPACE, value: {{ .Values.gateway.sandbox.namespace | quote }} }
            # Public domain for services. Empty = infer from the request Host
            # (drop the first two labels of the webui host).
            - { name: PUBLIC_SERVICE_DOMAIN, value: {{ .Values.gateway.publicServiceDomain | quote }} }
            - { name: FORGEJO_URL, value: {{ .Values.infra.forgejo.url | quote }} }
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef: { name: workspace-gateway-secrets, key: forgejo-token }
            - name: GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: workspace-gateway-secrets, key: service-token }
            - { name: GATEWAY_SERVICE_TENANT, value: {{ .Values.gateway.serviceToken.tenant | quote }} }
            - name: AGENT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: workspace-gateway-secrets, key: agent-admin-token }
            # Stalled-session watchdog: needs NATS + the service/admin tokens
            # (all present above), so it is wired independently of provisioning.
            - { name: NATS_URL, value: {{ include "workspace.natsUrl" . | quote }} }
            - { name: IDLEWATCH_ENABLED, value: {{ .Values.gateway.idlewatch.enabled | quote }} }
            - { name: IDLEWATCH_AFTER, value: {{ .Values.gateway.idlewatch.after | quote }} }
            - { name: IDLEWATCH_INTERVAL, value: {{ .Values.gateway.idlewatch.interval | quote }} }
            - { name: IDLEWATCH_COOLDOWN, value: {{ .Values.gateway.idlewatch.cooldown | quote }} }
            # Preview services (developer verification) + service logs.
            - { name: SERVICE_PREVIEW_TTL, value: {{ .Values.gateway.preview.ttl | quote }} }
            - { name: SERVICE_PREVIEW_REAP_INTERVAL, value: {{ .Values.gateway.preview.reapInterval | quote }} }
            - { name: SERVICE_LOG_TAIL, value: {{ .Values.gateway.serviceLogTail | quote }} }
            # Convergence (idempotent): seed per-tenant providers + force-set
            # the deployment-owned extension config so a stale value cannot win.
            {{- if .Values.gateway.provision.enabled }}
            - { name: PROVISION_ON_BOOT, value: "true" }
            - { name: PROVISION_DEFAULT_PROFILE, value: {{ .Values.gateway.provision.defaultProfile | quote }} }
            - name: PROVISION_RETIRED_PRESETS
              value: {{ .Values.gateway.provision.retiredPresets | toJson | quote }}
            - name: PROVISION_TENANT_PROFILE
              value: {{ .Values.gateway.provision.tenantProfile | toJson | quote }}
            - name: PROVISION_CALIBRATIONS
              value: {{ list
                (dict "tenant" "*" "extId" "workspace" "name" "gateway-url" "value" (printf "http://workspace-gateway.%s.svc.cluster.local:80" (include "workspace.namespace" .)))
                (dict "tenant" "*" "extId" "workspace" "name" "gateway-token" "value" .Values.gateway.serviceToken.token)
                (dict "tenant" "*" "extId" "playwright" "name" "selenium-url" "value" .Values.infra.seleniumUrl)
                (dict "tenant" "*" "extId" "bundled" "name" "brave_api_key" "value" .Values.gateway.braveApiKey)
                | toJson | quote }}
            {{- end }}
            - { name: IMAGE_REGISTRY_HOST, value: {{ .Values.infra.registry.host | quote }} }
            - { name: IMAGE_REGISTRY_SCHEME, value: {{ .Values.infra.registry.scheme | quote }} }
            - { name: TOOLCHAIN_ORG, value: {{ .Values.infra.registry.toolchainOrg | quote }} }
            - { name: DEFAULT_BASE_IMAGE, value: {{ .Values.gateway.registry.defaultBaseImage | quote }} }
            - { name: DERIVE_REPO, value: {{ .Values.gateway.registry.deriveRepo | quote }} }
            - { name: WORKER_BIN, value: {{ .Values.gateway.registry.workerBin | quote }} }
            - { name: WORKSPACE_RUNTIME, value: {{ .Values.gateway.runtime | quote }} }
            - { name: BUILDKIT_ADDR, value: {{ .Values.infra.buildkit.addr | quote }} }
            - { name: DOCKER_CONFIG, value: /home/user/.docker }
            - { name: SANDBOX_IDLE_TTL, value: {{ .Values.gateway.sandbox.idleTTL | quote }} }
            - { name: SANDBOX_REAP_INTERVAL, value: {{ .Values.gateway.sandbox.reapInterval | quote }} }
            # MUST bypass the proxy for in-cluster + registry traffic.
            - { name: NO_PROXY, value: {{ include "workspace.noProxy" . | quote }} }
            - { name: no_proxy, value: {{ include "workspace.noProxy" . | quote }} }
          ports:
            - { containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - { mountPath: /data, name: data }
            - { mountPath: /home/user/.docker, name: docker-config, readOnly: true }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.gateway.persistence.enabled }}
          hostPath:
            path: {{ .Values.gateway.persistence.hostPath }}
            type: {{ .Values.gateway.persistence.type }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Registry push credentials for image builds (infra buildkitd's config).
        - name: docker-config
          secret: { secretName: buildkitd-docker-config }
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-gateway
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
spec:
  selector: { app: workspace-gateway }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: v1
kind: Secret
metadata:
  name: workspace-gateway-secrets
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  forgejo-token: {{ .Values.gateway.forgejo.token | quote }}
  service-token: {{ .Values.gateway.serviceToken.token | quote }}
  agent-admin-token: {{ .Values.gateway.agentAdminToken | default .Values.agent.auth.adminToken | quote }}
{{- end }}
