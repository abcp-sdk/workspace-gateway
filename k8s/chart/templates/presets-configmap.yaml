{{- if .Values.agent.enabled }}
# Role presets (admin/maintainer/developer/planner/explorer) the workspace agent
# loads via SYSTEM_PRESETS_FILE. Generated by `go run ./cmd/gen-presets`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-presets
  namespace: {{ include "workspace.namespace" . }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
data:
  system-presets.json: |
{{ .Files.Get "system-presets.json" | indent 4 }}
{{- end }}
