{{- if and .Values.gateway.enabled .Values.gateway.workerRbac.create }}
# Sandbox/service RBAC for the gateway, in the `worker` namespace. Rendered as
# a separate manifest because the `worker` namespace is managed with a DIFFERENT
# credential than the workspace namespace (namespace-scoped RBAC); apply it with
# that context, e.g. `helm template ... --show-only templates/worker-rbac.yaml`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-gateway-sandboxes
  namespace: {{ .Values.gateway.sandbox.namespace }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Named PVCs (admin-managed storage for services).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # ConfigMaps referenced by services (env refs / volume mounts).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  # Long-lived services (Deployment + Service).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  # Helm releases render a WHITELIST of namespaced kinds (never cluster-scoped /
  # RBAC / CRD). Deployments are covered above; the rest follow.
  - apiGroups: [""]
    resources: ["serviceaccounts", "endpoints"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-gateway-sandboxes
  namespace: {{ .Values.gateway.sandbox.namespace }}
  labels:
    {{- include "workspace.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workspace.saName" . }}
    namespace: {{ include "workspace.namespace" . }}
roleRef:
  kind: Role
  name: workspace-gateway-sandboxes
  apiGroup: rbac.authorization.k8s.io
{{- end }}
