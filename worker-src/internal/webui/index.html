<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Worker</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<!-- ============================= LOGIN GATE ============================= -->
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card" autocomplete="off">
    <div class="gate-brand">
      <span class="mark">AW</span>
      <div>
        <h1>Agent Worker</h1>
        <p id="gate-sub" class="muted">Enter your bearer token to continue.</p>
      </div>
    </div>

    <label class="f">
      <span>Bearer token</span>
      <input id="gate-token" type="password" placeholder="token" autocomplete="off" />
    </label>
    <div id="gate-err" class="gate-err" role="alert"></div>
    <button id="gate-connect" type="submit" class="primary block">Connect</button>

    <div id="gate-claim-box" class="gate-claim hidden">
      <div class="sep"><span>or claim this worker</span></div>
      <p class="muted small">
        This worker is unclaimed. Paste the one-time code printed in its log to
        take exclusive ownership — you'll receive a token automatically.
      </p>
      <label class="f">
        <span>One-time code</span>
        <input id="gate-code" placeholder="code" autocomplete="off" />
      </label>
      <button id="gate-claim" type="button" class="block">Claim</button>
    </div>
  </form>
</div>

<!-- ============================= APP ============================= -->
<div id="app" class="app hidden">
  <header class="topbar">
    <span class="brand"><span class="mark sm">AW</span> Agent Worker</span>
    <span id="info-pill" class="pill">connecting…</span>
    <span class="spacer"></span>
    <button id="toggle-files" class="ghost">Files</button>
    <button id="toggle-jobs" class="ghost">Jobs</button>
    <button id="signout" class="ghost">Sign out</button>
  </header>

  <div class="body">
    <!-- ---- shell ---- -->
    <main class="shell">
      <div id="term" class="term" aria-live="polite"></div>
      <form id="prompt-form" class="prompt">
        <span id="prompt-cwd" class="prompt-cwd mono">/workspace</span>
        <span class="prompt-sign">$</span>
        <input id="prompt-input" class="prompt-input mono" placeholder="type a command, e.g. ls -la" autocomplete="off" spellcheck="false" />
        <button id="stop" type="button" class="danger" disabled>Stop</button>
      </form>
    </main>

    <!-- ---- files drawer ---- -->
    <aside id="files" class="drawer hidden">
      <div class="drawer-head">
        <span>Files</span>
        <span class="spacer"></span>
        <button id="f-new" class="ghost sm">New</button>
        <button id="f-close" class="ghost sm" aria-label="close">×</button>
      </div>
      <div id="f-crumb" class="crumb mono">/workspace</div>
      <div id="f-tree" class="tree"></div>
      <div id="f-editor" class="editor hidden">
        <div class="drawer-head">
          <span id="f-name" class="mono truncate"></span>
          <span class="spacer"></span>
          <button id="f-save" class="ghost sm">Save</button>
          <button id="f-dl" class="ghost sm">Download</button>
          <button id="f-del" class="ghost sm danger">Delete</button>
          <button id="f-back" class="ghost sm">Back</button>
        </div>
        <textarea id="f-content" class="mono" spellcheck="false"></textarea>
      </div>
    </aside>

    <!-- ---- jobs drawer ---- -->
    <aside id="jobs" class="drawer hidden">
      <div class="drawer-head">
        <span>Jobs</span>
        <span class="spacer"></span>
        <button id="j-refresh" class="ghost sm">Refresh</button>
        <button id="j-close" class="ghost sm" aria-label="close">×</button>
      </div>
      <table class="jobs"><thead><tr><th>id</th><th>state</th><th>exit</th><th>command</th></tr></thead>
      <tbody id="j-list"></tbody></table>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
